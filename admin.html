<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여우방 관리자</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><div class="brand">🦊 여우방 <b>관리자 모드</b></div>
<div id="login" class="card"><div class="section">관리자 로그인</div><input id="aid" placeholder="관리자 ID"><input id="apw" type="password" placeholder="비밀번호"><button class="btn main" onclick="login()">로그인</button><div class="small">관리자 8명 모두 동일한 전체 권한을 사용합니다.</div></div>
<div id="app" class="hidden"><div class="tabs"><button class="btn main" onclick="tab('dash')">대시보드</button><button class="btn light" onclick="tab('fox')">폭스바겐</button><button class="btn light" onclick="tab('follow')">맞팔명단</button><button class="btn light" onclick="tab('invite')">초대승인</button><button class="btn light" onclick="tab('notice')">공지</button><button class="btn light" onclick="tab('accounts')">관리자</button><button class="btn light" onclick="backup()">백업</button></div>
<section id="dash" class="ap"><div class="card"><div class="section">대시보드</div><div id="dashBox"></div></div></section>
<section id="fox" class="ap hidden"><div class="card"><div class="section">협찬 등록</div><input id="ct" placeholder="협찬명"><div class="grid"><select id="ctype"><option>피드</option><option>릴스</option><option>블로그</option><option>피드+릴스</option><option>피드or릴스</option></select><input id="cap" type="number" value="30"></div><div class="grid"><input id="mf" type="number" value="1000" placeholder="최소 팔로워"><input id="mr" type="number" value="1000" placeholder="최소 릴스조회수"></div><label><input id="uf" type="checkbox" checked style="width:auto"> 팔로워 조건</label> <label><input id="ur" type="checkbox" checked style="width:auto"> 릴스 조건</label> <label><input id="rp" type="checkbox" checked style="width:auto"> 공개계정</label><button class="btn main" onclick="createCampaign()">등록</button></div><div class="card"><div id="campaigns"></div></div></section>
<section id="follow" class="ap hidden"><div class="card"><div class="section">맞팔명단 관리</div><div class="grid"><input id="fn" placeholder="닉네임"><input id="fi" placeholder="@아이디"></div><button class="btn main" onclick="addFollow()">추가</button><hr><div class="grid"><input id="fno" type="number" placeholder="번호"><input id="fen" placeholder="새 닉네임"><input id="fei" placeholder="새 @아이디"></div><div class="row"><button class="btn light" onclick="editFollow()">수정</button><button class="btn danger" onclick="delFollow()">삭제</button><button class="btn dark" onclick="renumber()">번호 재정렬</button></div></div></section>

<section id="invite" class="ap hidden">
  <div class="card">
    <div class="section">💌 초대 승인</div>
    <button class="btn light" onclick="loadInvites()">새로고침</button>
    <div id="inviteAdminList"></div>
  </div>
</section>
<section id="notice" class="ap hidden"><div class="card"><div class="section">공지 관리</div><input id="nt" placeholder="제목"><textarea id="nc" placeholder="내용"></textarea><label><input id="ni" type="checkbox" style="width:auto"> 중요공지</label><button class="btn main" onclick="addNotice()">등록</button></div><div class="card" id="noticeList"></div></section>
<section id="accounts" class="ap hidden"><div class="card"><div class="section">관리자 계정</div><div class="notice">최대 8명 · 모든 관리자 동일 전체 권한</div><div class="grid"><input id="naid" placeholder="새 관리자 ID"><input id="naname" placeholder="표시 이름"><input id="narole" placeholder="역할 표시 (예: 일반관리자)"><input id="napw" type="password" placeholder="초기 비밀번호 6자 이상"></div><button class="btn main" onclick="createAccount()">관리자 추가</button><div id="accountList"></div></div></section>
</div></div><script src="config.js"></script><script src="api.js"></script><script>
const $=x=>document.getElementById(x);let token='',state={campaigns:[],notices:[],accounts:[]};function tab(id){document.querySelectorAll('.ap').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden')}async function login(){const r=await jsonp('adminLogin',{adminId:$('aid').value,password:$('apw').value});if(!r.ok)return alert(r.message);token=r.token;$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}
async function load(){const r=await jsonp('adminBootstrap',{token});if(!r.ok)return alert(r.message);state=r;render();loadInvites().catch(()=>{})}
function render(){$('dashBox').innerHTML=`협찬 ${state.campaigns.length}건 · 관리자 ${state.accounts.length}/8명`;$('campaigns').innerHTML=state.campaigns.map(c=>`<div class="item"><span class="badge">${c.status}</span> <b>${c.title}</b><div>${c.type} · ${c.count}/${c.capacity}명</div><div class="row">${c.status==='WAITING'?`<button class="btn main" onclick="startC('${c.id}')">15초 후 시작</button>`:''}${['OPEN','COUNTDOWN'].includes(c.status)?`<button class="btn light" onclick="closeC('${c.id}')">마감</button>`:''}<button class="btn light" onclick="participants('${c.id}')">명단</button><button class="btn danger" onclick="delC('${c.id}')">삭제</button></div><div id="p${c.id}"></div></div>`).join('');$('noticeList').innerHTML=state.notices.map(n=>`<div class="item"><b>${n.title}</b> <button class="btn danger" onclick="delNotice('${n.id}')">삭제</button></div>`).join('');$('accountList').innerHTML=state.accounts.map(a=>`<div class="item"><b>${a.displayName}</b> · ${a.id} · ${a.roleLabel}<div class="small">마지막 로그인 ${a.lastLogin||'-'}</div></div>`).join('')}
async function call(a,p={}){const r=await postViaForm(a,{token,...p});if(!r.ok)alert(r.message||'실패');return r}
async function createCampaign(){await call('adminCreateCampaign',{title:$('ct').value,type:$('ctype').value,capacity:$('cap').value,useFollower:$('uf').checked,minFollowers:$('mf').value,useReels:$('ur').checked,minReels:$('mr').value,requirePublic:$('rp').checked});load()}
async function startC(id){await call('adminStartCampaign',{campaignId:id,countdown:15});load()}async function closeC(id){await call('adminCloseCampaign',{campaignId:id});load()}async function delC(id){if(confirm('삭제할까요? 기록은 보존됩니다.')){await call('adminDeleteCampaign',{campaignId:id});load()}}async function participants(id){const r=await call('adminParticipants',{campaignId:id});$('p'+id).innerHTML=(r.items||[]).map(x=>`<div class="small">${x.number}. ${x.nickname} ${x.instagram} · ${x.time}</div>`).join('')||'참여자 없음'}
async function addFollow(){await call('adminAddFollow',{nickname:$('fn').value,instagram:$('fi').value});alert('처리했습니다.')}async function editFollow(){await call('adminUpdateFollow',{no:$('fno').value,nickname:$('fen').value,instagram:$('fei').value});alert('처리했습니다.')}async function delFollow(){if(confirm('삭제할까요?')){await call('adminDeleteFollow',{no:$('fno').value});alert('삭제했습니다.')}}async function renumber(){await call('adminRenumberFollow');alert('재정렬했습니다.')}
async function loadInvites(){const r=await call('adminInvites');if(!r.ok)return;const a=r.items||[];$('inviteAdminList').innerHTML=a.length?a.map(x=>`<div class="item"><b>${x.inviteeName}</b> ${x.inviteeInstagram}<div class="small">초대자: ${x.inviterName} ${x.inviterInstagram} · ${x.status}</div>${x.status==='PENDING'?`<div class="row"><button class="btn main" onclick="inviteStatus('${x.id}','APPROVED')">승인</button><button class="btn danger" onclick="inviteStatus('${x.id}','REJECTED')">거절</button></div>`:''}</div>`).join(''):'<div class="notice">초대 요청 없음</div>'}
async function inviteStatus(id,status){await call('adminInviteStatus',{id,status});await loadInvites();await load()}
async function addNotice(){await call('adminAddNotice',{title:$('nt').value,content:$('nc').value,important:$('ni').checked});load()}async function delNotice(id){await call('adminDeleteNotice',{noticeId:id});load()}
async function createAccount(){await call('adminCreateAccount',{newAdminId:$('naid').value,displayName:$('naname').value,roleLabel:$('narole').value,newPassword:$('napw').value});load()}async function backup(){const r=await call('adminBackup');if(r.ok)alert('백업 완료 '+r.time)}
</script></body></html>
