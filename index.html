<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여우방 통합 프로그램</title><link rel="stylesheet" href="styles.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script></head><body>
<div class="wrap"><div class="top"><div class="brand">🦊 여우방 <b>통합 프로그램</b></div><a class="btn light" href="admin.html">관리자</a></div>
<section id="home" class="page on"><div class="card"><div class="section">한곳에서 편하게 💗</div><div class="grid"><button class="btn light big" onclick="go('list')">👥 맞팔 명단</button><button class="btn light big" onclick="go('check')">🔎 맞팔 확인</button><button class="btn light big" onclick="go('fox')">🚗 폭스바겐</button><button class="btn light big" onclick="go('notice')">📢 공지</button></div></div><div id="homeCampaign" class="card">불러오는 중...</div></section>
<section id="list" class="page"><div class="card"><div class="section">👥 팔로우리스트</div><input id="q" placeholder="번호 / 닉네임 / 아이디 검색" oninput="renderList()"><div class="tabs" id="groups"></div><div class="small" id="listCount"></div><div id="listBox"></div></div></section>
<section id="check" class="page"><div class="card"><div class="section">🔎 맞팔 확인</div><div class="small">Instagram에서 받은 ZIP 파일을 기기 안에서 분석합니다. ZIP 자체는 서버에 업로드하지 않습니다.</div><input type="file" id="zip" accept=".zip"><button class="btn orange big" onclick="analyze()">확인하기</button></div><div class="card"><div class="tabs"><button class="btn light tab" onclick="showMatch('bad')">❌ 나를 안팔로우</button><button class="btn light tab" onclick="showMatch('good')">✅ 맞팔</button><button class="btn light tab" onclick="showMatch('outside')">📌 명단 밖</button></div><div id="match" class="notice">ZIP 파일을 선택해주세요.</div></div></section>
<section id="fox" class="page"><div id="campaign" class="card">불러오는 중...</div></section>
<section id="rides" class="page"><div class="card"><div class="section">🎫 내 참여내역</div><input id="rideIg" placeholder="@인스타아이디"><button class="btn main" onclick="loadRides()">확인</button><div id="rideList"></div></div></section>
<section id="notice" class="page"><div class="card"><div class="section">📢 공지</div><div id="notices"></div></div></section>
<section id="profile" class="page"><div class="card"><div class="section">👤 내 정보</div><div class="grid"><input id="nick" placeholder="닉네임"><input id="ig" placeholder="@인스타아이디"><input id="followers" type="number" placeholder="팔로워 수"><input id="reels" type="number" placeholder="릴스 조회수"></div><select id="pub"><option value="true">공개 계정</option><option value="false">비공개 계정</option></select><div class="row"><button class="btn light" onclick="loadMember()">불러오기</button><button class="btn main" onclick="saveMember()">저장</button></div></div></section></div>
<nav class="nav"><button class="on" onclick="go('home',this)">🏠<br>홈</button><button onclick="go('list',this)">👥<br>명단</button><button onclick="go('check',this)">🔎<br>맞팔</button><button onclick="go('fox',this)">🚗<br>폭스바겐</button><button onclick="go('rides',this)">🎫<br>내참여</button><button onclick="go('notice',this)">📢<br>공지</button><button onclick="go('profile',this)">👤<br>내정보</button></nav>
<script src="config.js"></script><script src="api.js"></script><script>
const $=x=>document.getElementById(x);let members=[],group='전체',campaign=null,offset=0,timer=null,match={bad:[],good:[],outside:[]};
function go(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));if(b)b.classList.add('on');if(id==='fox')loadCampaign();if(id==='notice')loadNotices()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function clean(v){return String(v||'').replace(/^@/,'').toLowerCase().trim()}
async function init(){try{const [b,f]=await Promise.all([jsonp('bootstrap'),jsonp('followList')]);offset=b.serverTime-Date.now();campaign=b.campaign;members=f.items||[];renderCampaign('homeCampaign');renderGroups();renderList();renderNotices(b.notices||[]);const saved=localStorage.getItem('yw_ig');if(saved){$('ig').value=saved;$('rideIg').value=saved;loadMember()}}catch(e){$('homeCampaign').textContent=e.message}}
function renderGroups(){const max=members.length?Math.ceil(Math.max(...members.map(x=>x.no))/30):0;$('groups').innerHTML=`<button class="btn light tab" onclick="setGroup('전체')">전체</button>`+Array.from({length:max},(_,i)=>`<button class="btn light tab" onclick="setGroup(${i+1})">${i+1}조</button>`).join('')}
function setGroup(g){group=g;renderList()}
function filtered(){const q=$('q').value.toLowerCase();return members.filter(x=>(group==='전체'||Math.floor((x.no-1)/30)+1===group)&&(!q||String(x.no).includes(q)||x.nickname.toLowerCase().includes(q)||x.instagram.toLowerCase().includes(q)))}
function renderList(){const a=filtered();$('listCount').textContent=`${a.length}명 / 전체 ${members.length}명`;$('listBox').innerHTML=a.slice(0,500).map(x=>`<div class="item"><b>${x.no}. ${esc(x.nickname)}</b><div class="small">${esc(x.instagram)}</div><a target="_blank" href="https://instagram.com/${clean(x.instagram)}">인스타 바로가기</a></div>`).join('')}
async function loadCampaign(){campaign=await jsonp('campaign');renderCampaign('campaign')}
function profile(){return {nickname:$('nick').value,instagram:$('ig').value,followers:$('followers').value,reels:$('reels').value,publicAccount:$('pub').value}}
function renderCampaign(id){const box=$(id);if(!box)return;if(!campaign){box.innerHTML='<div class="section">🚗 여우방 폭스바겐</div><div class="notice">현재 협찬이 없습니다.</div>';return}box.innerHTML=`<span class="badge">${campaign.type}</span><h2>${esc(campaign.title)}</h2><div class="stats"><div class="stat"><b>${campaign.capacity}</b><br>모집</div><div class="stat"><b>${campaign.count}</b><br>현재</div><div class="stat"><b>${Math.max(0,campaign.capacity-campaign.count)}</b><br>남음</div></div><div class="small">팔로워 조건 ${campaign.useFollower?campaign.minFollowers+'명':'없음'} · 릴스 조건 ${campaign.useReels?campaign.minReels+'회':'없음'} · ${campaign.requirePublic?'공개계정 필수':'공개조건 없음'}</div>${id==='campaign'?'<button id="rideBtn" class="btn big main" onclick="ride()">타요 🚗</button><div id="rideMsg"></div>':''}`;if(id==='campaign')updateButton()}
function updateButton(){const b=$('rideBtn');if(!b||!campaign)return;clearInterval(timer);if(campaign.status==='WAITING'){b.disabled=true;b.textContent='탑승 대기중 🔒';return}if(campaign.status==='CLOSED'){b.disabled=true;b.textContent='모집 마감';return}if(campaign.status==='COUNTDOWN'){b.disabled=true;timer=setInterval(()=>{const left=campaign.openAt-(Date.now()+offset);if(left<=0){clearInterval(timer);campaign.status='OPEN';b.disabled=false;b.textContent='타요 🚗'}else b.textContent=`${Math.ceil(left/1000)}초 후 타요 🚗`},100);return}b.disabled=false;b.textContent='타요 🚗'}
async function ride(){const b=$('rideBtn');b.disabled=true;b.textContent='접수 중...';try{const r=await postViaForm('ride',{campaignId:campaign.id,...profile()});if(r.ok){$('rideMsg').innerHTML=`<div class="notice">🎉 ${r.number}번 탑승 완료<br>${r.time}</div>`}else alert(r.message);await loadCampaign()}catch(e){alert(e.message);updateButton()}}
async function saveMember(){const r=await postViaForm('saveMember',profile());if(r.ok){localStorage.setItem('yw_ig',$('ig').value);alert('저장했어요.')}}
async function loadMember(){if(!$('ig').value)return;const m=await jsonp('member',{instagram:$('ig').value});if(!m)return;$('nick').value=m.nickname;$('ig').value=m.instagram;$('followers').value=m.followers;$('reels').value=m.reels;$('pub').value=String(m.publicAccount)}
async function loadRides(){const a=await jsonp('myRides',{instagram:$('rideIg').value});$('rideList').innerHTML=a.length?a.map(x=>`<div class="item"><b>${esc(x.title)}</b><div>${x.type} · ${x.number}번</div><div class="small">${x.time}</div></div>`).join(''):'<div class="notice">참여내역이 없습니다.</div>'}
async function loadNotices(){renderNotices(await jsonp('notices'))}
function renderNotices(a){$('notices').innerHTML=a.length?a.map(x=>`<div class="item">${x.important?'📌 ':''}<b>${esc(x.title)}</b><div>${esc(x.content)}</div><div class="small">${x.time}</div></div>`).join(''):'공지 없음'}
async function analyze(){const file=$('zip').files[0];if(!file)return alert('ZIP 파일을 선택해주세요.');const zip=await JSZip.loadAsync(file),followers=[];for(const n in zip.files){if(!zip.files[n].dir&&/followers.*\.(json|html|htm)$/i.test(n)){const t=await zip.files[n].async('text');let m;for(const re of [/"value"\s*:\s*"([^"]+)"/g,/instagram\.com\/([A-Za-z0-9._]+)/g])while((m=re.exec(t)))followers.push(clean(m[1]))}}const set=new Set(followers);match.bad=members.filter(x=>!set.has(clean(x.instagram)));match.good=members.filter(x=>set.has(clean(x.instagram)));const ids=new Set(members.map(x=>clean(x.instagram)));match.outside=[...new Set(followers)].filter(x=>!ids.has(x));showMatch('bad')}
function showMatch(t){const a=match[t];$('match').textContent=(t==='outside'?a.map((x,i)=>`${i+1}. @${x}`):a.map((x,i)=>`${i+1}. ${x.no}. ${x.nickname} ${x.instagram}`)).join('\n')||'0명'}
init();setInterval(()=>{if(campaign&&['OPEN','COUNTDOWN'].includes(campaign.status))loadCampaign()},2500);
</script></body></html>
