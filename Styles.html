
<style>
:root{
  --bg:#f7f8fb;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#7b8494;
  --line:#e8ebf1;
  --primary:#ff6f91;
  --primary2:#ff8faa;
  --danger:#ef4444;
  --orange:#f59e0b;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:40px}
.hidden{display:none!important}

.topbar{
  padding:22px 18px 12px;display:flex;justify-content:space-between;
  align-items:center;gap:12px
}
.brandWrap{display:flex;align-items:center;gap:11px;min-width:0}
.brandIcon{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:0 0 46px}
.brand{font-size:21px;font-weight:900;letter-spacing:-.7px}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.adminTopBtn{
  position:relative;padding:10px 12px;border-radius:13px;white-space:nowrap;
  background:#fff;border:1px solid var(--line);font-weight:900
}
.badge{
  position:absolute;right:-7px;top:-8px;min-width:23px;height:23px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;background:#ef4444;color:#fff;
  font-size:11px;border:2px solid var(--bg)
}

main{padding:0 16px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 4px 18px rgba(31,41,55,.05)
}
.hero{padding:30px 22px;text-align:center;margin-top:8px}
.heroImage{width:112px;height:112px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 8px}
.hero h1{font-size:29px;line-height:1.25;margin:10px 0 8px;letter-spacing:-1.3px}
.hero p{margin:0;color:var(--muted);line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button{
  border:1px solid var(--line);background:#fff;color:var(--text);
  border-radius:15px;padding:14px 16px;font-weight:800
}
button.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:none}
button.danger{background:#fff0f2;color:var(--danger);border-color:#ffd2d8}
button.ghost{background:#f7f8fb}
.bigBtn{min-height:62px}
.full{width:100%;margin-top:12px}
.back{background:transparent;border:none;padding:10px 2px;margin:4px 0 8px;color:#596275}
.formCard{padding:20px}
h2,h3{margin-top:0;letter-spacing:-.5px}
label{display:block;font-weight:800;font-size:14px;margin:14px 0 7px}
.hint{font-weight:500;color:var(--muted);font-size:12px}
input,textarea{
  width:100%;border:1px solid var(--line);border-radius:14px;padding:14px;
  background:#fbfcfe;outline:none;color:var(--text)
}
input:focus,textarea:focus{border-color:#ffadc0;box-shadow:0 0 0 3px rgba(255,111,145,.10)}
textarea{resize:vertical;min-height:86px}

.alertCard{
  margin-top:13px;padding:14px 16px;border-radius:16px;background:#fff7ed;
  border:1px solid #fed7aa;color:#8b5a12;display:flex;align-items:center;gap:7px;
  cursor:pointer
}
.alertCard span{margin-left:auto;font-size:12px;color:#a36a18}

.roomHead{padding:20px!important}
.roomTop{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.roomTop h2{margin:8px 0 0;font-size:24px}
.status{display:inline-block;font-size:12px;font-weight:900;padding:6px 9px;border-radius:999px}
.status.open{background:#e8f8ee;color:#208849}
.status.closed{background:#f2f3f5;color:#777}
.countBox{min-width:84px;text-align:right}
.countBox b{font-size:30px}
.countBox span{font-size:14px;color:var(--muted);margin-left:2px}
.meta{font-size:12px;color:var(--muted);margin-top:13px}
.note{margin-top:12px;padding:12px 13px;border-radius:13px;background:#fff6f8;color:#7b4c59;line-height:1.45;font-size:13px}
.roomActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.requestStatusBtn{width:100%;margin-top:10px;background:#f8fafc}

.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:22px 3px 10px}
.sectionTitle h3{margin:0}
.mini{padding:8px 10px;font-size:12px;border-radius:11px}
.linkList{display:flex;flex-direction:column;gap:10px}
.linkCard{display:flex;align-items:center;gap:12px;padding:13px 14px}
.linkNo{
  flex:0 0 34px;width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:#fff0f4;color:#e65478;font-weight:900
}
.linkInfo{min-width:0;flex:1}
.nick{font-weight:900}
.insta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.updated{font-size:10px;color:#a7aebb;margin-top:3px}
.goBtn{
  text-decoration:none;background:#1f2937;color:#fff;border-radius:12px;
  padding:11px 14px;font-weight:800;font-size:13px
}
.empty{text-align:center;color:var(--muted);padding:28px 18px;line-height:1.6}
.emptyImage{width:72px;height:72px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 10px}

.overlay{
  position:fixed;inset:0;background:rgba(17,24,39,.42);display:flex;
  align-items:flex-end;justify-content:center;z-index:30;padding:10px
}
.modal{
  width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;
  border-radius:24px 24px 18px 18px;padding:22px 18px calc(18px + env(safe-area-inset-bottom))
}
.modalDesc{font-size:13px;color:var(--muted);margin-top:-4px;line-height:1.45}
.modalIcon{width:52px;height:52px;border-radius:50%;object-fit:cover}
.adminTitle{display:flex;align-items:center;gap:11px}
.adminTitle h3{margin:0 0 4px}
.adminHeader{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.logoutBtn{padding:8px 10px;font-size:12px}

.requestMini,.adminRequest{
  border:1px solid var(--line);border-radius:15px;padding:13px;margin:10px 0;background:#fbfcfe
}
.requestMini{position:relative;line-height:1.45;font-size:13px}
.requestMini b{display:block;margin-bottom:6px}
.requestMini small{display:block;color:var(--muted);margin-top:5px}
.reqStatus{
  position:absolute;right:12px;top:12px;font-size:11px;font-weight:900;
  padding:5px 8px;border-radius:999px
}
.reqStatus.pending{background:#fff7db;color:#8b6b00}
.reqStatus.approved{background:#e8f8ee;color:#208849}
.reqStatus.rejected{background:#fff0f2;color:#c13d50}
.emptyMini{text-align:center;color:var(--muted);padding:26px 8px}
.adminReqTop{display:flex;justify-content:space-between;gap:10px;align-items:center}
.adminReqTop span{font-size:11px;color:var(--muted)}
.adminReqRoom{font-size:13px;color:var(--muted);margin:7px 0 10px}
.compareBox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.compareBox>div{
  border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;min-width:0
}
.compareBox small,.compareBox b,.compareBox a{display:block}
.compareBox small{color:var(--muted);margin-bottom:4px}
.compareBox b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compareBox a{font-size:12px;margin-top:7px;color:#2563eb;text-decoration:none}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:#111827;color:#fff;padding:12px 16px;border-radius:13px;
  z-index:60;font-weight:700;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.18);
  width:max-content;max-width:calc(100vw - 32px);text-align:center
}
body.loading:after{
  content:"처리 중…";position:fixed;inset:auto 50% 50% auto;transform:translate(50%,50%);
  background:#111827;color:#fff;padding:12px 16px;border-radius:13px;z-index:100;font-weight:800
}

@media (max-width:400px){
  .brand{font-size:18px}
  .sub{font-size:11px}
  .brandIcon{width:42px;height:42px;flex-basis:42px}
  .grid2,.roomActions{grid-template-columns:1fr}
  .hero h1{font-size:25px}
  .compareBox{grid-template-columns:1fr}
  .alertCard{align-items:flex-start;flex-wrap:wrap}
  .alertCard span{width:100%;margin-left:24px}
}
</style>

<style>
.accessGate,.accessOk{
  margin-top:14px;padding:14px 15px;display:flex;align-items:center;gap:11px
}
.accessGate{border-color:#fed7aa;background:#fffaf2}
.gateIcon{font-size:24px;flex:0 0 auto}
.gateText{min-width:0;flex:1}
.gateText b{display:block;font-size:14px}
.gateText span{display:block;color:#8b6b3d;font-size:12px;line-height:1.4;margin-top:3px}

}
</style>

<style>

<style>

}

<style>
/* v25 둥글고 귀여운 폰트 */
