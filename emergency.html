<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>여우방 오늘 이용</title>
<style>
:root{font-family:system-ui,sans-serif;color:#302434;background:#fff6f9}*{box-sizing:border-box}body{max-width:900px;margin:auto;padding:24px 18px}h1{font-size:28px;color:#87244c}h2{font-size:20px}section{background:white;border:1px solid #e3cbd5;border-radius:20px;padding:22px;margin:18px 0;box-shadow:0 6px 20px #45213908}label{display:block;margin:14px 0 6px}input,select,textarea,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #9c7c8a}input,textarea{width:100%}button{background:#802249;color:#fff;cursor:pointer;font-weight:650;min-height:44px}button:disabled{opacity:.55;cursor:wait}.secondary{background:white;color:#682544}a{color:#2448a5}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}.item{border-top:1px solid #e6d7de;padding:16px 0;overflow-wrap:anywhere}.open{display:inline-block;background:#fae2ed;border:1px solid #b96588;color:#5f1738;border-radius:10px;padding:11px;text-decoration:none}.open.last{background:#134ba4;color:white;border-color:#103b80}#notice{white-space:pre-wrap;padding:14px;background:#fff;border-left:4px solid #8b2452;min-height:48px}small,.hint{color:#645060;line-height:1.7}[hidden]{display:none!important}button:focus-visible,a:focus-visible{outline:3px solid #245ac2;outline-offset:3px}
</style></head><body>
<header><h1>여우방 오늘 이용</h1><p>기존 비밀번호로 로그인해 맞팔확인·요청·알림을 이용하세요.</p></header>
<p id="notice" role="status" aria-live="polite">로그인 후 이용할 수 있습니다.</p>
<section id="auth"><h2>로그인 / 처음 계정등록</h2><form id="loginForm">
<label for="instagram">인스타 아이디</label><input id="instagram" autocomplete="username" required maxlength="31" spellcheck="false">
<label for="password">기존 비밀번호 · 처음 등록 시 새 비밀번호</label><input id="password" type="password" inputmode="numeric" pattern="[0-9]{4,6}" autocomplete="current-password" required minlength="4" maxlength="6">
<label for="nickname">명단의 닉네임 (처음 등록할 때만)</label><input id="nickname" maxlength="100">
<div class="row"><button type="submit">로그인</button><button id="register" type="button" class="secondary">처음 계정등록</button></div></form></section>
<main id="app" hidden><section><div class="row"><strong id="identity"></strong><button id="logout" class="secondary">로그아웃</button></div><p class="hint">알림·요청 목록은 새로고침 버튼으로 확인하세요. 접속이 몰리면 잠시 후 다시 눌러 주세요. 이 화면은 1시간 후 재로그인이 필요합니다.</p></section>
<section><h2>팔로우리스트 · 맞팔확인</h2><p class="hint">인스타그램에서 다운로드한 팔로워·팔로잉 ZIP을 선택하세요. 파일은 기기 안에서만 분석하며 서버로 전송하지 않습니다. 다운로드 시점의 자료를 기준으로 확인합니다.</p>
<label for="zipFile">인스타그램 ZIP 파일</label><input id="zipFile" type="file" accept=".zip"><div class="row"><button id="analyze">맞팔확인</button><button id="loadRoster" class="secondary">명단 새로고침</button></div>
<p id="summary"></p><label for="filter">표시할 회원</label><select id="filter"><option value="all">전체</option><option value="onlyMe">나만 팔로우</option><option value="fansOnly">상대만 팔로우</option><option value="mutual">맞팔</option><option value="neither">서로 안 함</option></select>
<label for="search">아이디 또는 닉네임 검색</label><input id="search" type="search"><div id="roster"></div><button id="rosterMore" class="secondary" hidden>회원 더 보기</button></section>
<section><h2>맞팔요청</h2><div class="row"><select id="direction" aria-label="요청 구분"><option value="received">받은 요청</option><option value="sent">보낸 요청</option></select><button id="requestsReload">요청 새로고침</button></div><div id="requests"></div><button id="requestsMore" class="secondary" hidden>요청 더 보기</button></section>
<section><h2>알림 <span id="unread"></span></h2><div class="row"><button id="notificationsReload">알림 새로고침</button><button id="readAll" class="secondary">모두 읽음</button></div><div id="notifications"></div><button id="notificationsMore" class="secondary" hidden>알림 더 보기</button></section>
</main><script type="module" src="./emergency.mjs?v=2611"></script></body></html>
